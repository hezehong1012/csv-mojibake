<h1>プライバシーポリシー</h1>
<h2>1. 基本方針</h2>
<p>当サイトは、ユーザーのプライバシーを重要視し、個人情報の保護に関する法令を遵守します。</p>
<h2>2. ファイルの処理について</h2>
<p>当サイトはブラウザだけで動作し、ユーザーがアップロードしたCSVファイルをサーバーに保存しません。すべての処理はユーザーのブラウザ内で完結します。</p>
<h2>3. アクセス解析について</h2>
<p>当サイトでは、サービス向上のためにアクセス解析ツールを使用する場合があります。収集される情報は匿名であり、個人を特定するものではありません。</p>
